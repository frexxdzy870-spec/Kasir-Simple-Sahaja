<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Sahaja - POS Kasir</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div id="login-screen" class="fixed inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full mx-4">
            <h2 class="text-2xl font-bold mb-2 text-center text-amber-800">☕ Kopi Sahaja</h2>
            <p class="text-sm text-gray-500 text-center mb-6">Silakan login shift untuk memulai</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Nama Kasir</label>
                    <input type="text" id="shift-username" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500" placeholder="Contoh: Barista Ahmad">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Modal Awal (Rp)</label>
                    <input type="number" id="shift-cash" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500" value="50000">
                </div>
                <button onclick="startShift()" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-semibold py-2.5 rounded-lg transition">Mulai Shift Kasir</button>
            </div>
        </div>
    </div>

    <div class="min-h-screen flex flex-col">
        <header class="bg-amber-800 text-white px-6 py-4 flex justify-between items-center shadow-md">
            <div>
                <h1 class="text-xl font-bold tracking-wide">☕ KOPI SAHAJA POS</h1>
                <p id="cashier-display" class="text-xs text-amber-200">Kasir: -</p>
            </div>
            <button onclick="endShift()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-medium transition">Akhiri Shift</button>
        </header>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
            
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-bold mb-4 text-amber-900 flex items-center gap-2">➕ Input / Update Menu Barang</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <input type="text" id="prod-name" placeholder="Nama Menu" class="border rounded-lg p-2 text-sm">
                        <input type="number" id="prod-price" placeholder="Harga (Rp)" class="border rounded-lg p-2 text-sm">
                        <input type="number" id="prod-stock" placeholder="Stok Awal" class="border rounded-lg p-2 text-sm">
                        <button onclick="saveProduct()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg p-2 transition">Simpan Barang</button>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex-1">
                    <h3 class="text-lg font-bold mb-4 text-amber-900">📋 Menu Kedai Kopi</h3>
                    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col h-full justify-between">
                    <div>
                        <h3 class="text-lg font-bold mb-4 text-amber-900 border-b pb-2">🛒 Keranjang Belanja</h3>
                        <div id="cart-items" class="space-y-3 max-h-60 overflow-y-auto mb-4">
                            <p class="text-gray-400 text-sm text-center py-4">Belum ada item terpilih</p>
                        </div>
                    </div>

                    <div class="border-t pt-4 space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600 font-medium">Total Tagihan:</span>
                            <span id="total-price-display" class="text-2xl font-black text-amber-900">Rp 0</span>
                        </div>

                        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <h4 class="text-xs font-bold text-amber-800 uppercase tracking-wider mb-2">🧮 Kalkulator Kembalian Otomatis</h4>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Uang Dibayar (Rp)</label>
                                    <input type="number" id="cash-received" oninput="calculateChange()" class="w-full bg-white border border-amber-300 rounded-lg p-2 font-bold text-lg focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="0">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Kembalian (Rp)</label>
                                    <input type="text" id="cash-change" class="w-full bg-amber-100 border border-amber-200 rounded-lg p-2 font-bold text-lg text-amber-900" value="Rp 0" readonly>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1">Metode Pembayaran</label>
                            <select id="payment-method" onchange="togglePaymentMethod()" class="w-full border rounded-lg p-2">
                                <option value="Tunai">Tunai</option>
                                <option value="QRIS">QRIS (Wajib Foto Bukti)</option>
                            </select>
                        </div>

                        <div id="qris-camera-section" class="hidden space-y-2">
                            <label class="block text-sm font-medium text-amber-900">📸 Kamera Bukti QRIS</label>
                            <video id="video" class="w-full h-40 object-cover rounded-lg bg-black" autoplay playsinline></video>
                            <button id="capture-btn" onclick="capturePhoto()" class="w-full bg-blue-600 text-white text-xs py-2 rounded-lg font-medium hover:bg-blue-700">Ambil Foto Bukti</button>
                            <canvas id="canvas" class="hidden"></canvas>
                            <div id="photo-preview-container" class="hidden">
                                <p class="text-xs text-green-600 font-medium">✓ Foto berhasil dikunci</p>
                                <img id="photo-preview" class="w-full h-32 object-cover rounded-lg border mt-1">
                            </div>
                        </div>

                        <button onclick="submitTransaction()" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3 rounded-xl transition shadow-md">Selesaikan Pembayaran</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = "https://wbrznvzpckcgvzbowqoe.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndicnpudnpwY2tjZ3Z6Ym93cW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjA4NDYsImV4cCI6MjA5NjczNjg0Nn0.G1WMuzagPFqQURfcGuCZfTjqz2FLBr8eN3pJUdHQuOk";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State Aplikasi
        let currentShiftId = null;
        let currentCashier = "";
        let cart = {};
        let totalPrice = 0;
        let blobPhotoQRIS = null;

        // Elemen Kamera
        let streamObj = null;

        // 1. Shift Login
        async function startShift() {
            const username = document.getElementById('shift-username').value;
            const initialCash = parseInt(document.getElementById('shift-cash').value) || 0;

            if(!username) return alert("Nama Kasir wajib diisi!");

            const { data, error } = await supabase.from('shifts').insert([
                { cashier_name: username, initial_cash: initialCash, status: 'open' }
            ]).select();

            if (error) return alert("Gagal membuka shift database: " + error.message);

            currentShiftId = data[0].id;
            currentCashier = username;

            document.getElementById('cashier-display').innerText = `Kasir Bertugas: ${username}`;
            document.getElementById('login-screen').classList.add('hidden');
            loadProducts();
        }

        // 2. Load Produk dari Supabase
        async function loadProducts() {
            const { data, error } = await supabase.from('products').select('*');
            if (error) return console.error(error);

            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            data.forEach(prod => {
                grid.innerHTML += `
                    <div class="border p-4 rounded-xl bg-gray-50 flex flex-col justify-between hover:shadow-sm transition">
                        <div>
                            <h4 class="font-bold text-gray-900">${prod.name}</h4>
                            <p class="text-sm text-amber-800 font-semibold">Rp ${prod.price.toLocaleString()}</p>
                            <p class="text-xs text-gray-400">Stok: ${prod.stock}</p>
                        </div>
                        <button onclick="addToCart('${prod.id}', '${prod.name}', ${prod.price}, ${prod.stock})" class="mt-3 bg-amber-100 text-amber-900 hover:bg-amber-800 hover:text-white text-xs font-bold py-1.5 rounded-lg transition">+ Tambah</button>
                    </div>
                `;
            });
        }

        // 3. Simpan / Input Barang Baru
        async function saveProduct() {
            const name = document.getElementById('prod-name').value;
            const price = parseInt(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value);

            if(!name || !price) return alert("Nama dan Harga wajib diisi!");

            const { error } = await supabase.from('products').upsert({ name, price, stock }, { onConflict: 'name' });
            if(error) return alert("Gagal menyimpan barang: " + error.message);

            alert("Barang berhasil disimpan!");
            // Reset form
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-stock').value = '';
            loadProducts();
        }

        // 4. Manajemen Keranjang Belanja
        function addToCart(id, name, price, maxStock) {
            if (cart[id]) {
                if(cart[id].qty >= maxStock) return alert("Stok menu habis atau tidak mencukupi!");
                cart[id].qty++;
            } else {
                cart[id] = { name, price, qty: 1 };
            }
            renderCart();
        }

        function removeFromCart(id) {
            delete cart[id];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            totalPrice = 0;

            Object.keys(cart).forEach(id => {
                const item = cart[id];
                const subtotal = item.price * item.qty;
                totalPrice += subtotal;

                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border text-sm">
                        <div>
                            <p class="font-semibold text-gray-900">${item.name}</p>
                            <p class="text-xs text-gray-500">${item.qty} x Rp ${item.price.toLocaleString()}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-amber-900">Rp ${subtotal.toLocaleString()}</span>
                            <button onclick="removeFromCart('${id}')" class="text-red-500 hover:text-red-700 font-bold">✕</button>
                        </div>
                    </div>
                `;
            });

            if(Object.keys(cart).length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-sm text-center py-4">Belum ada item terpilih</p>`;
            }

            document.getElementById('total-price-display').innerText = `Rp ${totalPrice.toLocaleString()}`;
            calculateChange(); // update otomatis kembalian ketika isi keranjang berubah
        }

        // 5. KALKULATOR OTOMATIS KEMBALIAN
        function calculateChange() {
            const cashReceivedInput = document.getElementById('cash-received').value;
            const cashReceived = parseInt(cashReceivedInput) || 0;
            const changeField = document.getElementById('cash-change');

            if (cashReceivedInput === "") {
                changeField.value = "Rp 0";
                changeField.classList.remove('text-green-600', 'text-red-600');
                return;
            }

            const change = cashReceived - totalPrice;

            if (change >= 0) {
                changeField.value = `Rp ${change.toLocaleString()}`;
                changeField.classList.add('text-green-600');
                changeField.classList.remove('text-red-600');
            } else {
                changeField.value = `Kurang: Rp ${Math.abs(change).toLocaleString()}`;
                changeField.classList.add('text-red-600');
                changeField.classList.remove('text-green-600');
            }
        }

        // 6. Fitur Kamera Terbuka Otomatis untuk QRIS
        async function togglePaymentMethod() {
            const method = document.getElementById('payment-method').value;
            const cameraSection = document.getElementById('qris-camera-section');

            if(method === "QRIS") {
                cameraSection.classList.remove('hidden');
                // Aktifkan Kamera device belakang/utama otomatis jika ada
                try {
                    streamObj = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" }, 
                        audio: false 
                    });
                    document.getElementById('video').srcObject = streamObj;
                } catch (err) {
                    alert("Gagal membuka kamera: " + err.message);
                }
            } else {
                cameraSection.classList.add('hidden');
                stopCamera();
            }
        }

        function stopCamera() {
            if(streamObj) {
                streamObj.getTracks().forEach(track => track.stop());
                streamObj = null;
            }
        }

        function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const preview = document.getElementById('photo-preview');
            const previewContainer = document.getElementById('photo-preview-container');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert canvas menjadi image source preview
            const dataUrl = canvas.toDataURL('image/png');
            preview.src = dataUrl;
            previewContainer.classList.remove('hidden');

            // Simpan data blob asli untuk upload ke Supabase Storage nanti
            canvas.toBlob(blob => { blobPhotoQRIS = blob; }, 'image/png');
        }

        // 7. Selesaikan Transaksi Pembayaran & Pengurangan Stok Otomatis
        async function submitTransaction() {
            if(Object.keys(cart).length === 0) return alert("Keranjang belanja kosong!");
            
            const method = document.getElementById('payment-method').value;
            const cashReceived = parseInt(document.getElementById('cash-received').value) || 0;
            
            if (method === "Tunai" && cashReceived < totalPrice) {
                return alert("Pembayaran kurang! Cek kembali uang tunai yang diterima.");
            }

            let qrisUrl = null;

            // Jika QRIS, upload foto bukti dulu ke Supabase Storage
            if (method === "QRIS") {
                if(!blobPhotoQRIS) return alert("Wajib memfoto bukti transfer QRIS terlebih dahulu!");
                
                const fileName = `qris_${Date.now()}.png`;
                const { data: uploadData, error: uploadErr } = await supabase.storage
                    .from('qris-evidence')
                    .upload(fileName, blobPhotoQRIS, { contentType: 'image/png' });

                if(uploadErr) return alert("Gagal mengunggah bukti gambar: " + uploadErr.message);
                
                // Ambil URL Publik Gambar
                const { data: urlData } = supabase.storage.from('qris-evidence').getPublicUrl(fileName);
                qrisUrl = urlData.publicUrl;
            }

            // Simpan baris transaksi
            const { error: txError } = await supabase.from('transactions').insert([{
                shift_id: currentShiftId,
                total_price: totalPrice,
                payment_method: method,
                qris_evidence_url: qrisUrl
            }]);

            if(txError) return alert("Gagal menyimpan transaksi: " + txError.message);

            // Update Total Pendapatan Real-time di Shift aktif
            const { data: shiftData } = await supabase.from('shifts').select('total_revenue').eq('id', currentShiftId).single();
            const currentRevenue = shiftData?.total_revenue || 0;
            await supabase.from('shifts').update({ total_revenue: currentRevenue + totalPrice }).eq('id', currentShiftId);

            alert("🎉 Transaksi Berhasil Berhasil!");
            
            // Reset Keranjang & Input-input
            cart = {};
            blobPhotoQRIS = null;
            document.getElementById('cash-received').value = '';
            document.getElementById('photo-preview-container').classList.add('hidden');
            renderCart();
            stopCamera();
            document.getElementById('payment-method').value = "Tunai";
            document.getElementById('qris-camera-section').classList.add('hidden');
            loadProducts(); // Segarkan katalog menu & sisa stok terupdate
        }

        // 8. Tutup / Akhiri Shift
        async function endShift() {
            if(!currentShiftId) return;
            if(!confirm("Apakah Anda yakin ingin mengakhiri shift saat ini?")) return;

            await supabase.from('shifts').update({
                status: 'closed',
                end_time: new Date().toISOString()
            }).eq('id', currentShiftId);

            // Reset aplikasi ke kondisi awal layar login
            currentShiftId = null;
            currentCashier = "";
            cart = {};
            renderCart();
            stopCamera();
            document.getElementById('login-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
